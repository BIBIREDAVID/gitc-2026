<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Cropped from the real flyer's "gitc" wordmark (scripts in git
         history — see the icons.svg sprite for other UI icons; this is the
         only non-vector icon in /public since the source is raster art). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <!-- The hero flyer is the landing page's LCP element, but as a
         React-rendered <img> it isn't discoverable by the browser's
         preload scanner until JS runs. Preloading it here lets the fetch
         start immediately, in parallel with everything else. -->
    <link rel="preload" as="image" href="/flyer.webp" fetchpriority="high" type="image/webp" />
    <title>GITC 2026 — Get Into Tech Conference</title>
    <meta
      name="description"
      content="Register free for GITC 2026 — Get Into Tech Conference 2.0 — at LASU, in partnership with Zenith Bank &amp; Tumbs."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GITC 2026" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="GITC 2026 — Get Into Tech Conference" />
    <meta
      property="og:description"
      content="Register free for GITC 2026 — Get Into Tech Conference 2.0 — at LASU, in partnership with Zenith Bank &amp; Tumbs."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GITC 2026 — Get Into Tech Conference" />
    <meta
      name="twitter:description"
      content="Register free for GITC 2026 — Get Into Tech Conference 2.0 — at LASU, in partnership with Zenith Bank &amp; Tumbs."
    />
    <meta name="twitter:image" content="/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
